<div class="accesibilidad" role="toolbar" aria-label="Opciones de accesibilidad">
  <!-- Modo nocturno -->
  <button type="button" class="btn btn-icono tema" (click)="prefs.alternarTema()"
          [attr.aria-pressed]="prefs.tema() === 'oscuro'"
          [attr.aria-label]="prefs.tema() === 'oscuro' ? 'Cambiar a modo claro (Alt+N)' : 'Cambiar a modo nocturno (Alt+N)'"
          [title]="prefs.tema() === 'oscuro' ? 'Modo claro (Alt+N)' : 'Modo nocturno (Alt+N)'">
    <span aria-hidden="true">{{ prefs.tema() === 'oscuro' ? '☀️' : '🌙' }}</span>
  </button>

  <!-- Zoom integrado en el mismo panel -->
  <div class="zoom" role="group" aria-label="Tamaño de la interfaz">
    <button type="button" class="paso" (click)="prefs.alejar()" [disabled]="prefs.zoom() <= min"
            aria-label="Reducir zoom (Ctrl+Alt+-)" title="Reducir (Ctrl+Alt+-)">−</button>
    <button type="button" class="valor" (click)="prefs.restablecerZoom()" [disabled]="prefs.zoom() === 100"
            [attr.aria-label]="'Zoom actual ' + prefs.zoom() + ' por ciento. Pulse para volver a 100'"
            title="Volver a 100 % (Ctrl+Alt+0)">
      <output aria-live="polite">{{ prefs.zoom() }}%</output>
    </button>
    <button type="button" class="paso" (click)="prefs.acercar()" [disabled]="prefs.zoom() >= max"
            aria-label="Aumentar zoom (Ctrl+Alt++)" title="Aumentar (Ctrl+Alt++)">+</button>
  </div>
</div>
