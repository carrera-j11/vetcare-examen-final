@if (meta(); as m) {
  @if (m.total > 0) {
    <nav class="paginador" aria-label="Paginación">
      <p class="resumen" aria-live="polite">Mostrando <strong>{{ desde() }}–{{ hasta() }}</strong> de <strong>{{ m.total }}</strong></p>
      <label class="tamano">
        <span>Por página</span>
        <select [value]="m.tamano" (change)="tamano($event)" aria-label="Registros por página">
          @for (t of tamanos; track t) { <option [value]="t" [selected]="t === m.tamano">{{ t }}</option> }
        </select>
      </label>
      <div class="botones">
        <button type="button" class="btn btn-chico" (click)="ir(1)" [disabled]="m.pagina === 1" aria-label="Primera página">«</button>
        <button type="button" class="btn btn-chico" (click)="ir(m.pagina - 1)" [disabled]="m.pagina === 1" aria-label="Página anterior">‹ Anterior</button>
        <span class="actual">Página {{ m.pagina }} de {{ m.totalPaginas }}</span>
        <button type="button" class="btn btn-chico" (click)="ir(m.pagina + 1)" [disabled]="m.pagina >= m.totalPaginas" aria-label="Página siguiente">Siguiente ›</button>
        <button type="button" class="btn btn-chico" (click)="ir(m.totalPaginas)" [disabled]="m.pagina >= m.totalPaginas" aria-label="Última página">»</button>
      </div>
    </nav>
  }
}
